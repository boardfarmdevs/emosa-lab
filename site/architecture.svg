<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
  <title id="title">EMOSA high-level architecture</title><desc id="desc">Target acceptance: actual EasyMesh controller sends IEEE 1905 frames to EMOSA virtual agent, operation engine and OVSDB adapter, then an unchanged OpenSync pod. An independent physical Wi-Fi client observes behavior. A separate optional hwsim AP and station path supports component tests only. Wire and physical paths remain pending.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#597367" stroke-width="1.5"/></marker><style>text{font-family:system-ui,sans-serif;fill:#203a34}.title{font-size:30px;font-weight:600}.label{font-size:12px;letter-spacing:1px}.name{font-size:18px;font-weight:600}.small{font-size:13px}.note{font-size:12px;fill:#6b5140}.box{fill:#fffefa;stroke:#bdcbbb;stroke-width:1.5}.arrow{stroke:#597367;stroke-width:1.6;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="830" fill="#f6f5f0"/><text x="45" y="55" class="title">EMOSA / adapt the control plane, keep the pod</text><text x="45" y="85" class="small">Target architecture · semantic components tested · wire, hwsim integration and physical acceptance pending</text>
  <rect x="45" y="120" width="1110" height="340" rx="12" fill="#e9eee3" stroke="#c8d2c3"/><text x="65" y="147" class="label">CONTROLLER ENVIRONMENT · DEDICATED LXD VM + INNER CONTAINERS</text>
  <rect class="box" x="70" y="207" width="205" height="118" rx="7"/><text x="88" y="239" class="name">EasyMesh controller</text><text x="88" y="265" class="small">Independent candidate</text><text x="88" y="302" class="note">Discovery baseline captured</text>
  <path d="M275 265H345" class="arrow"/><text x="284" y="236" class="small">1905</text><text x="282" y="290" class="small">frames</text>
  <rect x="345" y="175" width="595" height="248" rx="8" fill="#dce8d8" stroke="#799778" stroke-dasharray="5 4"/><text x="365" y="198" class="label">EMOSA · ALL NEW ADAPTER CODE LIVES HERE</text>
  <rect class="box" x="365" y="220" width="170" height="108" rx="6"/><text x="382" y="250" class="name">Virtual agent</text><text x="382" y="274" class="small">Discovery / WSC</text><text x="382" y="305" class="note">P0 → I3 / I4 pending</text>
  <path d="M535 270H555" class="arrow"/><rect class="box" x="555" y="220" width="170" height="108" rx="6"/><text x="568" y="250" class="name">Operation engine</text><text x="568" y="274" class="small">Guard / reconcile</text><text x="568" y="305" class="small">Component tested</text>
  <path d="M725 270H745" class="arrow"/><rect class="box" x="745" y="220" width="175" height="108" rx="6"/><text x="760" y="250" class="name">OVSDB adapter</text><text x="760" y="274" class="small">Schema / map / monitor</text><text x="760" y="305" class="small">Simulator tested</text>
  <rect class="box" x="555" y="355" width="365" height="48" rx="6"/><text x="573" y="385" class="small">SQLite journal · events · private secret references</text><path d="M640 328V352" class="arrow"/>
  <rect class="box" x="968" y="210" width="162" height="180" rx="6"/><text x="985" y="242" class="name">Evaluation</text><text x="985" y="270" class="small">Scenarios / faults</text><text x="985" y="294" class="small">Watch / inspect</text><text x="985" y="318" class="small">Reports / compare</text><text x="985" y="363" class="small">Evidence hashes</text>
  <path d="M830 425V490H380V530" class="arrow"/><text x="465" y="483" class="small">Existing authorized OVSDB connection</text>
  <rect class="box" x="65" y="530" width="470" height="125" rx="8"/><text x="87" y="562" class="name">Unchanged physical OpenSync pod</text><text x="87" y="591" class="small">Existing managers → driver → actual radio</text><text x="87" y="630" class="note">Actual schema / firmware / writer control / M0 pending</text>
  <path d="M535 585H635" class="arrow"/><text x="549" y="568" class="small">Actual RF</text>
  <rect class="box" x="635" y="530" width="495" height="125" rx="8"/><text x="655" y="562" class="name">Independent physical Wi-Fi client</text><text x="655" y="591" class="small">LXD station + real Wi-Fi NIC + wpa_supplicant</text><text x="655" y="630" class="note">Observe association / authentication / traffic / reconnect</text>
  <path d="M1048 530V395" class="arrow"/><text x="1060" y="475" class="small">Evidence</text>
  <rect x="65" y="692" width="1065" height="94" rx="8" fill="#f7ead6" stroke="#d5bea0"/><text x="86" y="720" class="label">OPTIONAL RADIO LAB · SEPARATE FROM PHYSICAL ACCEPTANCE</text><text x="86" y="747" class="small">LXD hostapd AP ⇄ mac80211_hwsim in the VM kernel ⇄ LXD wpa_supplicant station</text><text x="86" y="770" class="note">Standalone smoke harness. OVSDB-to-hostapd integration pending. No RF link to physical pods.</text>
