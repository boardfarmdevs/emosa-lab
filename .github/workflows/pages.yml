# Pages: the EasyMesh labs' shared workflow (easymesh-labs .github/workflows/labs-pages.yml)
# checks this repository's documentation, runs its pages/build, adds the labs bar and
# deploys from main. Pages source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    uses: boardfarmdevs/easymesh-labs/.github/workflows/labs-pages.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
