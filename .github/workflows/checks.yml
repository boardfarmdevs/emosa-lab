name: component-checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The evidence files kept outside git
        run: python3 scripts/fetch-evidence.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      - run: uv python install 3.13.7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m unit --junitxml=unit-results.xml
      - name: Replay observed egress losses through the production source
        run: |
          uv run python scripts/replay-egress-accounting.py docs/records/evidence/egress-accounting/egress-loss-01 > /tmp/emosa-egress-replay.json
          cmp /tmp/emosa-egress-replay.json docs/records/evidence/egress-accounting/egress-loss-01/egress-projection.json
      - name: Replay common transmit/receive accounting through the production source
        run: |
          uv run python scripts/replay-egress-accounting.py --bidirectional docs/records/evidence/receive-accounting/ingress-loss-03 > /tmp/emosa-receive-replay.json
          cmp /tmp/emosa-receive-replay.json docs/records/evidence/receive-accounting/ingress-loss-03/backhaul-projection.json
      - name: Replay calibrated virtual service through the production source
        run: |
          uv run python scripts/replay-egress-accounting.py --virtual-service docs/records/evidence/virtual-capacity/virtual-link-03 > /tmp/emosa-capacity-replay.json
          cmp /tmp/emosa-capacity-replay.json docs/records/evidence/virtual-capacity/virtual-link-03/virtual-capacity-projection.json
      - name: Replay combined shaped-backhaul losses and service
        run: |
          for label in shaped-ingress-01 shaped-egress-02 shaped-queue-02; do
            uv run python scripts/replay-egress-accounting.py --shaped-backhaul docs/records/evidence/shaped-backhaul/$label > /tmp/emosa-shaped-replay.json
            cmp /tmp/emosa-shaped-replay.json docs/records/evidence/shaped-backhaul/$label/shaped-projection.json
          done
      - name: Reproduce selected synthetic AP reports
        run: |
          uv run python -m emosa_lab.simulation.ap_metrics /tmp/emosa-ap-vectors
          cmp /tmp/emosa-ap-vectors/synthetic-ap-metrics.pcap docs/records/evidence/ap-reporting/vectors/synthetic-ap-metrics.pcap
  easymesh-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The evidence files kept outside git
        run: python3 scripts/fetch-evidence.py
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - run: python3 scripts/check-easymesh-reference.py
      - run: python3 scripts/check-ieee1905-reference.py
      - run: >-
          python3 scripts/check-report-reference.py
          --report-capture docs/records/evidence/reports/run-01/right.pcap
          --report-capture docs/records/evidence/reports/run-02/right.pcap
          --coordinator-directory docs/records/evidence/coordinator/run-01
          --coordinator-directory docs/records/evidence/coordinator/run-02
      - run: python3 deploy/peer-baseline/compatibility/check-capture.py
      - run: >-
          python3 scripts/check-controller-probe.py
          --directory docs/records/evidence/native-discovery/run-06
          --directory docs/records/evidence/native-discovery/run-07
      - run: python3 scripts/check-controller-candidate.py
      - run: python3 scripts/check-native-onboarding.py docs/records/evidence/native-onboarding/run-05
      - run: python3 scripts/check-native-active.py docs/records/evidence/native-active/run-03
      - run: python3 scripts/check-native-recovery.py docs/records/evidence/native-soak/run-01
      - run: python3 scripts/check-disassociation-reference.py
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/final-statistics/native-byte-counters-01 --minimum-seconds 150
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/station-removal/native-final-source-01 --minimum-seconds 150
      - run: >-
          python3 scripts/check-station-removal.py
          docs/records/evidence/station-removal/native-final-source-01
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/counter-accounting/native-counter-audit-01 --minimum-seconds 150
      - run: >-
          python3 scripts/check-station-removal.py
          docs/records/evidence/counter-accounting/native-counter-audit-01
      - run: >-
          python3 scripts/check-station-accounting.py
          docs/records/evidence/counter-accounting/native-counter-audit-01
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/reporting-policy/native-policy-receipt-01 --minimum-seconds 210
      - run: >-
          python3 scripts/check-native-policy.py
          docs/records/evidence/reporting-policy/native-policy-receipt-01
      - run: >-
          python3 scripts/check-medium-accounting.py
          docs/records/evidence/medium-loss/native-medium-loss-05
      - run: >-
          python3 scripts/check-native-policy.py
          docs/records/evidence/medium-loss/native-medium-loss-05
      - run: >-
          python3 scripts/check-tx-status-accounting.py
          docs/records/evidence/tx-status/native-tx-status-01
      - run: >-
          python3 scripts/check-telemetry-gap.py
          docs/records/evidence/telemetry-freshness/native-telemetry-gap-01
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/telemetry-freshness/native-telemetry-gap-01 --minimum-seconds 210
      - run: >-
          python3 scripts/check-native-policy.py
          docs/records/evidence/telemetry-freshness/native-telemetry-gap-01
      - run: python3 scripts/check-ap-metrics-reference.py docs/records/evidence/ap-reporting/vectors
      - run: python3 scripts/check-native-ap-withholding.py docs/records/evidence/ap-reporting/native-ap-report-02
      - run: python3 scripts/check-native-peer-metrics.py docs/records/evidence/ap-reporting/native-ap-report-02
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/ap-reporting/native-ap-report-02 --minimum-seconds 210
      - run: python3 scripts/check-telemetry-gap.py docs/records/evidence/ap-reporting/native-ap-report-02
      - name: Verify the 15-minute lifecycle and recovery evidence
        run: |
          python3 scripts/check-native-lifecycle.py docs/records/evidence/native-lifecycle/native-lifecycle-soak-01
          python3 scripts/check-native-recovery.py docs/records/evidence/native-lifecycle/native-lifecycle-soak-01
          python3 scripts/check-native-peer-metrics.py docs/records/evidence/native-lifecycle/native-lifecycle-soak-01
          python3 scripts/check-native-ap-withholding.py docs/records/evidence/native-lifecycle/native-lifecycle-soak-01
          python3 scripts/check-telemetry-gap.py docs/records/evidence/native-lifecycle/native-lifecycle-soak-01
      - name: Verify native sparse ESP failure and corrected receipt
        run: |
          python3 scripts/check-native-ap-esp.py --baseline-failure docs/records/evidence/ap-esp/native-ap-esp-old-01
          python3 scripts/check-native-ap-esp.py docs/records/evidence/ap-esp/native-ap-esp-new-01
      - name: Verify live disconnect joins and 15-minute recovery
        run: |
          python3 scripts/check-session-reasons.py docs/records/evidence/session-reasons/native-reason-04
          python3 scripts/check-native-lifecycle.py docs/records/evidence/session-reasons/native-reason-04
          python3 scripts/check-native-recovery.py docs/records/evidence/session-reasons/native-reason-04
          python3 scripts/check-native-peer-metrics.py docs/records/evidence/session-reasons/native-reason-04
          python3 scripts/check-native-ap-withholding.py docs/records/evidence/session-reasons/native-reason-04
          python3 scripts/check-telemetry-gap.py docs/records/evidence/session-reasons/native-reason-04
      - name: Preserve early observer and controller-receipt failures
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          root = Path("docs/records/evidence/session-reasons")
          cases = [
              ("check-session-reasons.py", "native-reason-02", "live reason observer unhealthy"),
              ("check-native-peer-metrics.py", "native-reason-01", "native controller interface statistics never reflect this response"),
              ("check-native-peer-metrics.py", "native-reason-03", "native controller interface statistics never reflect this response"),
          ]
          for script, label, expected in cases:
              check = runpy.run_path(str(Path("scripts") / script))["check"]
              try:
                  check(root / label)
              except AssertionError as error:
                  assert str(error) == expected, (label, str(error))
              else:
                  raise AssertionError(f"Retained failure must not pass: {label}")
          PY
      - name: Preserve the observed early peer-query failure
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          check = runpy.run_path("scripts/check-native-peer-metrics.py")["check"]
          try:
              check(Path("docs/records/evidence/ap-reporting/native-ap-report-01"))
          except AssertionError as error:
              assert str(error) == "unanswered live peer query or unexpected reply count", str(error)
          else:
              raise AssertionError("retained early peer-query failure must not pass")
          PY
      - run: python3 scripts/check-neighbor-metrics.py
      - run: python3 scripts/check-native-peer-metrics.py docs/records/evidence/native-peer-metrics/native-peer-metrics-04
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/native-peer-metrics/native-peer-metrics-04 --minimum-seconds 210
      - run: python3 scripts/check-native-policy.py docs/records/evidence/native-peer-metrics/native-peer-metrics-04
      - run: python3 scripts/check-telemetry-gap.py docs/records/evidence/native-peer-metrics/native-peer-metrics-04
      - name: Preserve the observed startup-channel failure
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          check = runpy.run_path("scripts/check-native-recovery.py")["check"]
          try:
              check(Path("docs/records/evidence/native-peer-metrics/native-peer-metrics-03-limited"), "tshark", minimum_seconds=210)
          except AssertionError as error:
              assert str(error) == "channel query/selection missing timely response", str(error)
          else:
              raise AssertionError("retained startup failure must not pass recovery acceptance")
          PY
      - run: python3 scripts/check-shaped-backhaul.py docs/records/evidence/shaped-backhaul/shaped-queue-02
      - run: python3 scripts/check-shaped-backhaul.py docs/records/evidence/shaped-backhaul/shaped-ingress-01
      - run: python3 scripts/check-shaped-backhaul.py docs/records/evidence/shaped-backhaul/shaped-egress-02
      - run: python3 scripts/check-shaped-backhaul.py --native docs/records/evidence/shaped-backhaul/native-shaped-01
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/shaped-backhaul/native-shaped-01 --minimum-seconds 210
      - run: python3 scripts/check-native-policy.py docs/records/evidence/shaped-backhaul/native-shaped-01
      - run: python3 scripts/check-telemetry-gap.py docs/records/evidence/shaped-backhaul/native-shaped-01
      - run: python3 scripts/check-virtual-capacity.py docs/records/evidence/virtual-capacity/virtual-link-03
      - run: python3 scripts/check-virtual-capacity.py --native docs/records/evidence/virtual-capacity/native-capacity-02
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/virtual-capacity/native-capacity-02 --minimum-seconds 210
      - run: python3 scripts/check-native-policy.py docs/records/evidence/virtual-capacity/native-capacity-02
      - run: python3 scripts/check-telemetry-gap.py docs/records/evidence/virtual-capacity/native-capacity-02
      - name: Missing framing attempt must not qualify a service source
        run: |
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          check = runpy.run_path("scripts/check-virtual-capacity.py")["check"]
          try:
              check(Path("docs/records/evidence/virtual-capacity/native-capacity-01-limited"), True)
          except AssertionError as error:
              assert "no service windows" in str(error)
          else:
              raise AssertionError("missing framing unexpectedly accepted")
          PY
      - run: >-
          python3 scripts/check-neighbor-metrics.py --native-directory
          docs/records/evidence/neighbor-metrics/native-neighbor-01
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/neighbor-metrics/native-neighbor-01 --minimum-seconds 210
      - run: >-
          python3 scripts/check-telemetry-gap.py
          docs/records/evidence/neighbor-metrics/native-neighbor-01
      - run: >-
          python3 scripts/check-native-policy.py
          docs/records/evidence/neighbor-metrics/native-neighbor-01
      - run: >-
          python3 scripts/check-forwarding-observations.py
          docs/records/evidence/forwarding/native-forwarding-01
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/forwarding/native-forwarding-01 --minimum-seconds 210
      - run: >-
          python3 scripts/check-telemetry-gap.py
          docs/records/evidence/forwarding/native-forwarding-01
      - run: >-
          python3 scripts/check-native-policy.py
          docs/records/evidence/forwarding/native-forwarding-01
      - run: >-
          python3 scripts/check-neighbor-metrics.py --native-directory
          docs/records/evidence/forwarding/native-forwarding-01
      - run: >-
          python3 scripts/check-neighbor-binding.py
          docs/records/evidence/neighbor-binding/native-link-binding-04
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/neighbor-binding/native-link-binding-04 --minimum-seconds 210
      - run: >-
          python3 scripts/check-telemetry-gap.py
          docs/records/evidence/neighbor-binding/native-link-binding-04
      - run: >-
          python3 scripts/check-native-policy.py
          docs/records/evidence/neighbor-binding/native-link-binding-04
      - run: >-
          python3 scripts/check-neighbor-metrics.py --native-directory
          docs/records/evidence/neighbor-binding/native-link-binding-04
      - run: >-
          python3 scripts/check-backhaul-accounting.py
          docs/records/evidence/neighbor-binding/native-link-binding-04
      - run: >-
          python3 scripts/check-backhaul-accounting.py --loss-probe
          docs/records/evidence/backhaul-accounting/backhaul-loss-02
      - run: >-
          python3 scripts/check-egress-accounting.py
          docs/records/evidence/egress-accounting/egress-loss-01
      - run: >-
          python3 scripts/check-egress-accounting.py --native
          docs/records/evidence/egress-accounting/native-egress-01
      - run: >-
          python3 scripts/check-receive-accounting.py
          docs/records/evidence/receive-accounting/ingress-loss-03
      - run: >-
          python3 scripts/check-receive-accounting.py --native
          docs/records/evidence/receive-accounting/native-receive-01
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/receive-accounting/native-receive-01 --minimum-seconds 210
      - run: >-
          python3 scripts/check-telemetry-gap.py
          docs/records/evidence/receive-accounting/native-receive-01
      - run: >-
          python3 scripts/check-native-policy.py
          docs/records/evidence/receive-accounting/native-receive-01
      - run: >-
          python3 scripts/check-neighbor-metrics.py --native-directory
          docs/records/evidence/receive-accounting/native-receive-01
      - run: >-
          python3 scripts/check-native-recovery.py
          docs/records/evidence/egress-accounting/native-egress-01 --minimum-seconds 210
      - run: >-
          python3 scripts/check-telemetry-gap.py
          docs/records/evidence/egress-accounting/native-egress-01
      - run: >-
          python3 scripts/check-native-policy.py
          docs/records/evidence/egress-accounting/native-egress-01
      - run: >-
          python3 scripts/check-neighbor-metrics.py --native-directory
          docs/records/evidence/egress-accounting/native-egress-01
      - run: >-
          python3 scripts/check-discovery-reference.py
          --directory docs/records/evidence/discovery-session/run-01
          --directory docs/records/evidence/discovery-session/run-02
      - run: >-
          python3 scripts/check-wsc-wire-reference.py
          --directory docs/records/evidence/wsc-wire/packet-normal
          --directory docs/records/evidence/wsc-wire/packet-lost-reply
          --directory docs/records/evidence/wsc-wire/radio-normal/ethernet
          --directory docs/records/evidence/wsc-wire/radio-lost-reply/ethernet
          --radio-directory docs/records/evidence/wsc-wire/radio-normal
          --radio-directory docs/records/evidence/wsc-wire/radio-lost-reply
  wsc-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - run: python3 scripts/check-wsc-reference.py
  ovsdb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The evidence files kept outside git
        run: python3 scripts/fetch-evidence.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      - run: uv python install 3.13.7
      - run: uv sync --frozen
      - run: >-
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
          cmake libcjson-dev libsqlite3-dev
      - run: bash scripts/build-ovsdb.sh
      - run: python3 scripts/build-wsc-registrar.py
      - run: uv run pytest -m ovsdb --junitxml=ovsdb-results.xml
      - name: The adapter kit's C agent builds from what the kit carries
        run: |
          kit=$(deploy/adapter/build.sh "$RUNNER_TEMP/kit" | tail -1)
          cmake -S "${kit%.tar.gz}/c" -B "$RUNNER_TEMP/kit-c-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/kit-c-build" -j
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovsdb-evidence
          path: |
            ovsdb-results.xml
            .cache/upstream/openvswitch-4.0.0/*-emosa.log
  box:
    # the lab in a box (spec/box-scenarios.md): every scenario with one agent, C or Python,
    # the real binary in a private network namespace with a pod, a controller and a broker
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        agent: [python, c]
    name: box (${{ matrix.agent }})
    steps:
      - uses: actions/checkout@v4
      - name: The evidence files kept outside git
        run: python3 scripts/fetch-evidence.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      - run: uv python install 3.13.7
      - run: uv sync --frozen
      - run: >-
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
          cmake libcjson-dev libsqlite3-dev mosquitto dnsmasq-base
      - run: bash scripts/build-ovsdb.sh
      - run: python3 scripts/build-wsc-registrar.py
      - run: cmake -S c -B c/build && cmake --build c/build -j
      - name: The scenarios
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe ip_gre    # the GTP's gretaps, created in the box's own namespace
          EMOSA_BOX_REQUIRED=1 EMOSA_BOX_AGENTS=${{ matrix.agent }} \
            uv run pytest -m box --durations=10 --junitxml=box-results-${{ matrix.agent }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box-results-${{ matrix.agent }}
          path: box-results-${{ matrix.agent }}.xml
  c:
    # the C agent's bar (c/QUALITY.md): the warning set as errors on both
    # compilers, the vectors and units, the sanitizers, the static analyzer
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: gcc, cc: gcc, flags: ""}
          - {name: clang, cc: clang, flags: ""}
          - {name: sanitizers, cc: gcc, flags: "-DEMOSA_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug"}
    name: c (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libcjson-dev libssl-dev libsqlite3-dev
      - run: cmake -S c -B c/build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DEMOSA_STRICT=ON ${{ matrix.flags }}
      - run: cmake --build c/build -j
      - run: ctest --test-dir c/build --output-on-failure
  c-i686:
    # the 32-bit x86 target of the RDK gateway images (core2-32): the same bar there
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update
          sudo apt-get install -y cmake pkg-config gcc-multilib libcjson-dev:i386 libssl-dev:i386 libsqlite3-dev:i386
      - run: cmake -S c -B c/build -DEMOSA_STRICT=ON -DCMAKE_C_FLAGS=-m32
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
      - run: cmake --build c/build -j
      - run: file c/build/emosa-agent-c | grep -q "ELF 32-bit"
      - run: ctest --test-dir c/build --output-on-failure
  c-package:
    # a distribution's package (EMOSA_INSTALL_DATA, as the Yocto recipe builds it): the
    # programs, data, units, helper and bill of materials where the units expect them
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libcjson-dev libssl-dev libsqlite3-dev
      - run: >-
          cmake -S c -B c/build -DEMOSA_STRICT=ON -DEMOSA_INSTALL_DATA=ON -DCMAKE_INSTALL_PREFIX=/usr
          -DCMAKE_INSTALL_SYSCONFDIR=/etc -DEMOSA_SCHEMAS_DIR=/usr/share/emosa/schemas
          -DEMOSA_SYSTEMD_UNIT_DIR=/lib/systemd/system
      - run: cmake --build c/build -j
      - run: DESTDIR=$PWD/root cmake --install c/build
      - name: the package's files
        run: |
          cd root
          for f in usr/bin/emosa-agent-c usr/bin/emosa-fleet-c usr/bin/emosa-gtp-c \
                   usr/libexec/emosa/emosa-agent-link etc/default/emosa \
                   lib/systemd/system/emosa-fleet.service lib/systemd/system/emosa-agent@.service \
                   lib/systemd/system/emosa-gtp.service usr/share/emosa/emosa-c.spdx.json \
                   usr/share/emosa/schemas/agent-config.schema.json \
                   usr/share/emosa/profiles/opensync-lab-hwsim-6.6.1-v1.json; do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q "ExecStart=/usr/bin/emosa-agent-c /etc/emosa/%i.json" lib/systemd/system/emosa-agent@.service
          usr/bin/emosa-agent-c --version
          python3 -c "import json; d = json.load(open('usr/share/emosa/emosa-c.spdx.json')); assert d['spdxVersion'] == 'SPDX-2.3'"
  c-analyzer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang clang-tools libcjson-dev libssl-dev libsqlite3-dev
      - run: scan-build cmake -S c -B c/build
      - run: scan-build --status-bugs cmake --build c/build -j
  c-fuzz:
    # each fuzz target (c/fuzz) for a bounded time from its seed corpus, under
    # ASan and UBSan; a crash or report fails the job
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-rt-18-dev libcjson-dev libssl-dev libsqlite3-dev
      - run: cmake -S c -B c/build -DCMAKE_C_COMPILER=clang -DEMOSA_FUZZ=ON -DEMOSA_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build c/build -j --target emosa-fuzz-cmdu emosa-fuzz-stats emosa-fuzz-rows emosa-fuzz-wsc emosa-fuzz-fleet emosa-fuzz-gtp emosa-fuzz-control emosa-fuzz-mqtt emosa-fuzz-ovsdb emosa-fuzz-config
      - name: fuzz
        env:
          ASAN_OPTIONS: detect_leaks=1:fast_unwind_on_malloc=0
          EMOSA_SCHEMAS: schemas # the config target's schemas
        run: |
          mkdir -p fuzz-artifacts
          for target in cmdu stats rows wsc fleet gtp control mqtt ovsdb config; do
            mkdir -p "fuzz-$target" && cp c/fuzz/corpus/$target/* "fuzz-$target/"
            c/build/emosa-fuzz-$target -max_total_time=60 -print_final_stats=1 \
              -artifact_prefix="fuzz-artifacts/$target-" "fuzz-$target"
          done
      # a crash, leak or timeout input, to reproduce: emosa-fuzz-TARGET fuzz-artifacts/FILE
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
  c-cert:
    # clang-tidy's CERT checks: no finding but the deviations QUALITY.md §5 records
    # (marked NOLINT at their lines)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang clang-tidy libcjson-dev libssl-dev libsqlite3-dev
      - run: cmake -S c -B c/build -DCMAKE_C_COMPILER=clang -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: run-clang-tidy -quiet -p c/build -checks='-*,cert-*' -warnings-as-errors='cert-*' "$PWD/c/src/.*"
