name: component-checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      - run: uv python install 3.13.7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m unit --junitxml=unit-results.xml
  easymesh-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - run: python3 scripts/check-easymesh-reference.py
      - run: python3 scripts/check-ieee1905-reference.py
      - run: python3 scripts/check-report-reference.py --report-capture doc/evidence/reports/run-01/right.pcap --report-capture doc/evidence/reports/run-02/right.pcap
      - run: python3 deploy/peer-baseline/compatibility/check-capture.py
  wsc-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - run: python3 scripts/check-wsc-reference.py
  ovsdb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      - run: uv python install 3.13.7
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - run: bash scripts/build-ovsdb.sh
      - run: uv run pytest -m ovsdb --junitxml=ovsdb-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ovsdb-evidence
          path: |
            ovsdb-results.xml
            .cache/upstream/openvswitch-4.0.0/*-emosa.log
