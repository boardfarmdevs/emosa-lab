<tspan x="1393" dy="0">Telemetry collector / exporter</tspan>
<tspan x="1393" dy="29.700000000000003">Component or cooperating service</tspan>
</text>
<path d="M 1393 1090 L 1393 905" fill="none" stroke="#8243a8" stroke-width="3" marker-end="url(#purple)" stroke-dasharray="9 7"/>
