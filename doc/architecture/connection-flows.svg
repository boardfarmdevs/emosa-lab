<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1430" viewBox="0 0 1680 1430" role="img" aria-labelledby="title desc">
<title id="title">Existing OpenSync and gateway EasyMesh, followed by the target EMOSA control and telemetry flows</title>
<desc id="desc">The upper panels compare each OpenSync pod's own cloud management and telemetry sessions with a gateway EasyMesh controller managing native agents. The lower panel proposes one EMOSA service with per-pod contexts, unchanged OpenSync extenders, separately qualified root ownership, and a telemetry collector exporting to ODH, the data lake in the network center. Proposed integrations are dashed. No physical EMOSA or ODH delivery is proven.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1769aa"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8243a8"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182b40} .muted{fill:#4d6175} .blue{fill:#1769aa} .purple{fill:#8243a8}</style>
