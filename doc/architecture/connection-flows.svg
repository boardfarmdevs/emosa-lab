<text x="75" y="1323" font-size="21" font-weight="normal" text-anchor="start" class="muted">
<tspan x="75" dy="0">Control migration and telemetry delivery are separate obligations. Firmware stays unchanged; endpoint/trust changes need qualification.</tspan>
</text>
