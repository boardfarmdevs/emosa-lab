<text x="841" y="1403" font-size="20" font-weight="normal" text-anchor="start" class="">
<tspan x="841" dy="0">Integration or qualification pending</tspan>
</text>
<text x="1645" y="1403" font-size="20" font-weight="normal" text-anchor="end" class="muted">
