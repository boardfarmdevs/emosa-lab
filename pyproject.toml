[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "emosa"
version = "0.1.0"
description = "EMOSA: EasyMesh to OpenSync adapter (one virtual EasyMesh agent per OpenSync pod)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography==50.0.1",
    "jsonschema==4.26.0",
    "ovs==4.0.0",
    "paho-mqtt==2.1.0",
    "protobuf==6.33.5",
]

[project.scripts]
emosa-fleet = "emosa.agent.fleet:main"
emosa-agent = "emosa.agent.pod:main"
emosa-gtp = "emosa.gtp:main"

[dependency-groups]
# The lab tools (lab/, package emosa_lab) are developed and tested alongside
# the adapter; a --no-dev install is the adapter alone.
dev = ["emosa-lab", "pytest==9.1.1", "ruff==0.16.7"]

[tool.uv.workspace]
members = ["lab"]

[tool.uv.sources]
emosa-lab = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/emosa"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "emosa/contracts"
"tests/fixtures/opensync/opensync.ovsschema" = "emosa/data/opensync.ovsschema"
"tests/fixtures/opensync/LICENSE.opensync" = "emosa/data/LICENSE.opensync"
"tests/fixtures/opensync/provenance.json" = "emosa/data/opensync-provenance.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "unit: unprivileged deterministic tests",
  "ovsdb: real disposable ovsdb-server and independent simulated manager",
  "wire: selected normative protocol prerequisites required",
  "hardware: qualified physical target required",
  "external: independent controller required",
]

[tool.ruff]
target-version = "py313"
src = ["src", "lab/src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
